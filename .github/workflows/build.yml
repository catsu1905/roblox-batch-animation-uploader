name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller requests

      - name: Build exe
        run: pyinstaller --onefile --name BatchAnimationUploader upload_animations.py

      - uses: actions/upload-artifact@v4
        with:
          name: BatchAnimationUploader-windows
          path: dist/BatchAnimationUploader.exe

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BatchAnimationUploader.exe
          generate_release_notes: true
