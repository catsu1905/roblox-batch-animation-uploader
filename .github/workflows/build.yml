name: Build Windows exe

on:
  push:
    branches: [main]
    paths:
      - "BatchAnimationUploader.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --name BatchAnimationUploader BatchAnimationUploader.py

      - uses: actions/upload-artifact@v4
        with:
          name: BatchAnimationUploader-windows
          path: dist/BatchAnimationUploader.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: v1.1.${{ github.run_number }}
          files: dist/BatchAnimationUploader.exe
          generate_release_notes: true
          make_latest: true
